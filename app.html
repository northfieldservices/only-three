<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Only Three</title>
<meta name="description" content="Write down what's on your mind, keep one list of tasks, and pick up to three to do now.">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Only Three">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100dvh; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 600px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px 28px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 16px; min-height: 40px; }
  header.top h1 { font: 600 28px/1.1 var(--serif); margin: 0; letter-spacing: -.01em; }
  header.top .sub { color: var(--muted); font-size: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent);
          background: var(--accent-soft); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 28px 0 10px; }
  .h2 h2 { font: 600 13px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .h2 .linkish { font-size: 14px; }
  .linkish { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 15px; }

  /* the write box: always ready */
  .write { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px; transition: border-color .15s; }
  .write:focus-within { border-color: var(--accent); }
  .write textarea { display: block; width: 100%; min-height: 92px; max-height: 50vh; border: 0; outline: none; resize: none; background: transparent;
                    padding: 12px 12px 6px; font-size: 17px; line-height: 1.45; }
  .write .acts { display: flex; gap: 6px; padding: 6px; flex-wrap: wrap; }
  .write .acts button { flex: 1 1 auto; min-height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper);
                        font-weight: 600; font-size: 14px; padding: 0 12px; white-space: nowrap; }
  .write .acts button.pri { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .write .acts button:disabled { opacity: .4; }
  .write .hint { font-size: 12px; color: var(--muted); padding: 0 12px 8px; }

  /* Now: the three */
  .three { display: grid; gap: 10px; }
  .item { display: grid; grid-template-columns: 38px 1fr 44px; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 10px 8px 10px 14px; min-height: 70px; }
  .item .num { font: 400 34px/1 var(--serif); color: var(--accent); text-align: center; }
  .item .text { font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; background: none; border: 0; text-align: left; padding: 6px 0; }
  .item.done { background: transparent; }
  .item.done .text { color: var(--muted); text-decoration: line-through; }
  .item.done .num { color: var(--done); }
  .slot { border: 1.5px dashed var(--line); border-radius: var(--radius); min-height: 60px; display: grid; grid-template-columns: 38px 1fr; align-items: center;
          gap: 8px; padding: 10px 14px; color: var(--muted); background: none; text-align: left; width: 100%; font-size: 15px; }
  .slot .num { font: 400 34px/1 var(--serif); color: var(--line); text-align: center; }
  .check { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; padding: 0; }
  .check svg { width: 20px; height: 20px; opacity: 0; transform: scale(.6); transition: all .15s; }
  .done .check, .row.done .check { background: var(--done); border-color: var(--done); color: #fff; }
  .done .check svg, .row.done .check svg { opacity: 1; transform: none; }
  .finished { margin-top: 12px; text-align: center; padding: 14px; border-radius: var(--radius); background: radial-gradient(120% 140% at 50% 0%, var(--accent-soft), transparent 70%); }
  .finished b { display: block; font: 600 20px/1.2 var(--serif); }
  .finished span { color: var(--muted); font-size: 14px; }

  /* task + thought rows */
  .add { display: flex; gap: 8px; margin-bottom: 8px; }
  .add input { flex: 1; min-width: 0; min-height: 48px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 0 14px; font-size: 16px; outline: none; }
  .add input:focus { border-color: var(--accent); }
  .add .btn { min-height: 48px; padding: 0 18px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row .check { width: 32px; height: 32px; }
  .row .check svg { width: 16px; height: 16px; }
  .row .t { background: none; border: 0; padding: 6px 0; text-align: left; font-size: 16px; overflow-wrap: anywhere; }
  .row.done .t { color: var(--muted); text-decoration: line-through; }
  .row .tools { display: flex; gap: 4px; }
  .ic { width: 38px; height: 38px; border-radius: 10px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
  .ic svg { width: 20px; height: 20px; }
  .ic:hover { background: var(--accent-soft); color: var(--accent); }
  .pill { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: none; font-size: 13px; font-weight: 600; color: var(--ink); }
  .pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .thought { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .thought .when { font-size: 12px; color: var(--muted); }
  .thought .body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; margin: 4px 0 6px; background: none; border: 0; padding: 0; text-align: left; width: 100%; }
  .thought .tools { display: flex; gap: 14px; }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; font-size: 15px; }

  /* more */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
  .stat b { display: block; font: 600 24px/1.1 var(--serif); }
  .stat span { font-size: 12px; color: var(--muted); }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; text-align: center; font-size: 12px; color: var(--muted); }
  .week .d { display: grid; gap: 5px; justify-items: center; padding: 8px 0; border-radius: 12px; }
  .week .d.today { background: var(--card); outline: 1px solid var(--line); }
  .week i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); display: block; }
  .week i.f { background: var(--done); border-color: var(--done); }
  .set { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .set small { display: block; color: var(--muted); }
  .set input[type=time], .set select { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--ink); }
  .fine { font-size: 13px; color: var(--muted); margin-top: 20px; }

  /* nav */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line);
             padding: 4px 8px calc(4px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(4, 1fr); }
  nav.tabs button { background: none; border: 0; padding: 8px 0; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); position: relative; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button[aria-current="page"] { color: var(--ink); }
  nav.tabs .n { position: absolute; top: 2px; left: calc(50% + 8px); font-size: 10px; background: var(--accent); color: #fff; border-radius: 999px; padding: 0 5px; line-height: 16px; }
  body.typing nav.tabs { display: none; }

  /* sheet + toast */
  .scrim { position: fixed; inset: 0; background: rgba(15,12,8,.42); z-index: 40; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 600px; margin: 0 auto; background: var(--card);
           border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h3 { font: 600 19px/1.2 var(--serif); margin: 2px 0 12px; }
  .sheet textarea { width: 100%; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); padding: 12px 14px; font-size: 17px; resize: vertical; outline: none; min-height: 90px; }
  .sheet .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .sheet .actions .btn { flex: 1 1 40%; min-height: 46px; padding: 0 12px; }
  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60;
           background: var(--ink); color: var(--paper); padding: 8px 8px 8px 16px; border-radius: 999px; font-size: 14px; display: flex; align-items: center; gap: 10px;
           box-shadow: 0 6px 20px rgba(0,0,0,.18); max-width: calc(100vw - 32px); }
  .toast button { background: none; border: 0; color: var(--glow); font-weight: 700; padding: 6px 10px; }
  .toast:not(:has(button)) { padding-right: 16px; }
  @keyframes pop { 40% { transform: scale(1.03); } }
  .just { animation: pop .3s ease; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="wrap" id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Now</button>
  <button data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>Tasks</button>
  <button data-tab="thoughts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Thoughts</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
